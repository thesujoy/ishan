<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">

<title>404 | Ishan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:"Poppins",sans-serif;
min-height:100vh;
background:#14121f;
color:#f8f5ff;
overflow-x:hidden;
display:flex;
align-items:center;
justify-content:center;
padding:28px;
position:relative;
}

/* =============================
   Same Theme Animated Background
============================= */

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 18% 18%,rgba(196,181,253,.26),transparent 30%),
radial-gradient(circle at 82% 72%,rgba(251,113,133,.20),transparent 34%),
radial-gradient(circle at 50% 90%,rgba(45,212,191,.14),transparent 36%),
linear-gradient(135deg,#14121f,#1f1b33 55%,#101827);
z-index:-5;
animation:bgMove 12s ease-in-out infinite alternate;
}

@keyframes bgMove{
from{
filter:hue-rotate(0deg);
}
to{
filter:hue-rotate(10deg);
}
}

body::after{
content:"";
position:fixed;
width:360px;
height:360px;
border-radius:50%;
background:rgba(196,181,253,.13);
right:-120px;
top:-110px;
filter:blur(40px);
z-index:-4;
animation:orbMove 8s ease-in-out infinite alternate;
}

@keyframes orbMove{
from{
transform:translate(0,0);
}
to{
transform:translate(-40px,55px);
}
}

.bg-dot{
position:fixed;
width:6px;
height:6px;
border-radius:50%;
background:rgba(248,245,255,.45);
z-index:-2;
animation:dotFloat 7s ease-in-out infinite;
}

@keyframes dotFloat{
0%,100%{
transform:translateY(0);
opacity:.35;
}
50%{
transform:translateY(-22px);
opacity:.8;
}
}

/* =============================
   Card
============================= */

.card{
width:680px;
max-width:100%;
text-align:center;
padding:48px 34px;
border-radius:30px;
background:rgba(255,255,255,.075);
border:1px solid rgba(255,255,255,.14);
box-shadow:0 28px 80px rgba(0,0,0,.35);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
animation:cardShow .8s ease both;
position:relative;
overflow:hidden;
}

@keyframes cardShow{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.card::before{
content:"";
position:absolute;
top:0;
left:50%;
transform:translateX(-50%);
width:150px;
height:4px;
border-radius:999px;
background:linear-gradient(90deg,#c4b5fd,#fb7185,#2dd4bf);
}

.error-code{
font-size:92px;
line-height:1;
font-weight:700;
letter-spacing:2px;
color:#fff;
display:inline-block;
animation:errorWave 3.8s ease-in-out infinite;
text-shadow:
0 0 18px rgba(196,181,253,.28),
0 0 28px rgba(251,113,133,.16);
}

@keyframes errorWave{
0%,100%{
transform:translateY(0) skewX(0deg);
}
25%{
transform:translateY(-3px) skewX(-2deg);
}
50%{
transform:translateY(0) skewX(0deg);
}
75%{
transform:translateY(3px) skewX(2deg);
}
}

h1{
margin-top:14px;
font-size:30px;
font-weight:700;
color:#fff;
}

.message{
max-width:500px;
margin:18px auto 0;
font-size:16px;
line-height:1.75;
color:#e9e5f3;
}

.timer{
margin-top:24px;
font-size:14px;
font-weight:500;
color:#c4b5fd;
}

.timer span{
color:#fb7185;
font-weight:700;
}

.progress{
width:100%;
max-width:420px;
height:8px;
margin:15px auto 0;
border-radius:999px;
background:rgba(255,255,255,.10);
overflow:hidden;
border:1px solid rgba(255,255,255,.10);
}

.progress span{
display:block;
height:100%;
width:100%;
border-radius:999px;
background:linear-gradient(90deg,#c4b5fd,#fb7185,#2dd4bf);
animation:progressBar 10s linear forwards;
}

@keyframes progressBar{
from{
width:100%;
}
to{
width:0%;
}
}

/* =============================
   Social
============================= */

.social{
display:flex;
justify-content:center;
gap:14px;
margin-top:34px;
}

.social a{
width:48px;
height:48px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
color:#fff;
text-decoration:none;
position:relative;
overflow:hidden;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.16);
transition:.32s ease;
}

.social a i{
position:relative;
z-index:2;
}

.social a::before{
content:"";
position:absolute;
inset:0;
opacity:0;
transition:.32s ease;
}

.social a:hover{
transform:translateY(-6px) scale(1.06);
border-color:rgba(255,255,255,.32);
}

.social a.facebook::before{
background:#1877f2;
}

.social a.facebook:hover::before{
opacity:1;
}

.social a.instagram::before{
background:
radial-gradient(circle at 30% 105%,#fdf497 0%,#fdf497 18%,#fd5949 42%,#d6249f 62%,#285AEB 100%);
}

.social a.instagram:hover::before{
opacity:1;
}

.social a.x-twitter::before{
background:#000;
}

.social a.x-twitter:hover::before{
opacity:1;
}

footer{
margin-top:34px;
font-size:13px;
color:#b9b4c8;
}

/* Mobile */

@media(max-width:600px){

body{
padding:22px;
}

.card{
padding:42px 22px;
border-radius:26px;
}

.error-code{
font-size:72px;
}

h1{
font-size:25px;
}

.message{
font-size:15px;
line-height:1.7;
}

.social a{
width:44px;
height:44px;
font-size:16px;
}

footer{
font-size:12px;
}

}

@media(prefers-reduced-motion:reduce){

*{
animation:none !important;
transition:none !important;
}

}

</style>

</head>

<body>

<div class="bg-dot" style="left:12%;top:22%;animation-delay:0s"></div>
<div class="bg-dot" style="left:82%;top:25%;animation-delay:1.5s"></div>
<div class="bg-dot" style="left:20%;top:78%;animation-delay:3s"></div>
<div class="bg-dot" style="left:76%;top:82%;animation-delay:4.5s"></div>

<div class="card">

<div class="error-code">
404
</div>

<h1>
Page Not Found
</h1>

<p class="message">
Looks like this page wandered into the unknown. You will be redirected to the home page shortly.
</p>

<div class="timer">
Redirecting in <span id="count">10</span> seconds
</div>

<div class="progress">
<span></span>
</div>

<div class="social">

<a href="https://facebook.com/itsIshanSarkar" target="_blank" rel="noopener" class="facebook">

<i class="fab fa-facebook-f"></i>

</a>

<a href="https://instagram.com/itsIshanSarkar" target="_blank" rel="noopener" class="instagram">

<i class="fab fa-instagram"></i>

</a>

<a href="https://x.com/itsIshanSarkar" target="_blank" rel="noopener" class="x-twitter">

<i class="fab fa-x-twitter"></i>

</a>

</div>

<footer>

© 2026 Ishan. All Rights Reserved.

</footer>

</div>

<script>

let seconds=10;
let count=document.getElementById("count");

let timer=setInterval(function(){

seconds--;

count.textContent=seconds;

if(seconds<=0){

clearInterval(timer);

window.location.href="/";

}

},1000);

</script>

</body>
</html>
