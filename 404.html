<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">

<title>404 | Ishan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Poppins",sans-serif;
background:#09070f;
color:#fff;
overflow-x:hidden;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
position:relative;
}

/* Background */

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 15% 20%,rgba(255,77,109,.28),transparent 28%),
radial-gradient(circle at 85% 75%,rgba(255,209,102,.22),transparent 30%),
radial-gradient(circle at 60% 15%,rgba(145,99,255,.20),transparent 32%),
linear-gradient(135deg,#07060d,#141020 45%,#08070d);
z-index:-5;
animation:bgShift 12s ease-in-out infinite alternate;
}

@keyframes bgShift{
from{filter:hue-rotate(0deg);}
to{filter:hue-rotate(18deg);}
}

body::after{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
background-size:70px 70px;
mask-image:radial-gradient(circle,black 35%,transparent 80%);
z-index:-4;
animation:gridSlide 30s linear infinite;
}

@keyframes gridSlide{
from{background-position:0 0;}
to{background-position:140px 140px;}
}

/* Floating Shapes */

.float-shape{
position:fixed;
width:70px;
height:90px;
border-radius:16px;
background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.03));
border:1px solid rgba(255,255,255,.12);
box-shadow:0 20px 50px rgba(0,0,0,.25);
z-index:-2;
animation:shapeFloat 8s ease-in-out infinite;
}

.float-shape::before{
content:"";
position:absolute;
left:15px;
right:15px;
top:20px;
height:2px;
background:rgba(255,255,255,.32);
box-shadow:
0 12px rgba(255,255,255,.22),
0 24px rgba(255,255,255,.16);
}

.shape-one{
top:15%;
left:8%;
transform:rotate(-14deg);
}

.shape-two{
right:8%;
bottom:14%;
width:85px;
height:60px;
transform:rotate(13deg);
animation-delay:-3s;
}

.shape-three{
right:16%;
top:12%;
width:48px;
height:48px;
border-radius:50%;
animation-delay:-5s;
}

@keyframes shapeFloat{
0%,100%{translate:0 0;}
50%{translate:0 -24px;}
}

/* Floating Dots */

.dot{
position:fixed;
width:4px;
height:4px;
border-radius:50%;
background:rgba(255,255,255,.38);
box-shadow:0 0 16px rgba(255,255,255,.55);
animation:float 12s linear infinite;
z-index:-1;
}

@keyframes float{
from{
transform:translateY(110vh) scale(.7);
opacity:0;
}
20%{opacity:.9;}
80%{opacity:.9;}
to{
transform:translateY(-20vh) scale(1.2);
opacity:0;
}
}

/* Card */

.card{
width:620px;
max-width:100%;
text-align:center;
padding:48px 34px;
position:relative;
overflow:hidden;
border-radius:34px;
background:rgba(255,255,255,.075);
border:1px solid rgba(255,255,255,.16);
backdrop-filter:blur(24px);
-webkit-backdrop-filter:blur(24px);
box-shadow:
0 35px 100px rgba(0,0,0,.58),
inset 0 1px 0 rgba(255,255,255,.15);
animation:cardIn .9s ease both;
}

@keyframes cardIn{
from{
opacity:0;
transform:translateY(35px) scale(.96);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.card::before{
content:"";
position:absolute;
width:280px;
height:280px;
border-radius:50%;
background:radial-gradient(circle,rgba(255,77,109,.25),transparent 70%);
left:-100px;
top:-120px;
z-index:-1;
}

.card::after{
content:"";
position:absolute;
width:250px;
height:250px;
border-radius:50%;
background:radial-gradient(circle,rgba(255,209,102,.18),transparent 70%);
right:-100px;
bottom:-120px;
z-index:-1;
}

.error-code{
font-size:96px;
line-height:1;
font-weight:700;
letter-spacing:2px;
background:linear-gradient(90deg,#fff,#ffd166,#ff7892,#fff);
background-size:250%;
-webkit-background-clip:text;
background-clip:text;
color:transparent;
animation:nameGlow 5s ease-in-out infinite;
}

@keyframes nameGlow{
0%,100%{background-position:0% 50%;}
50%{background-position:100% 50%;}
}

h1{
margin-top:12px;
font-size:30px;
font-weight:700;
}

.message{
max-width:480px;
margin:18px auto 0;
font-size:16px;
line-height:1.7;
color:#eeeeee;
}

.timer{
margin-top:22px;
font-size:14px;
color:#ffd166;
}

.progress{
width:100%;
height:8px;
border-radius:999px;
background:rgba(255,255,255,.12);
overflow:hidden;
margin-top:14px;
}

.progress span{
display:block;
height:100%;
width:100%;
border-radius:999px;
background:linear-gradient(90deg,#ffd166,#ff4d6d);
animation:progressBar 10s linear forwards;
}

@keyframes progressBar{
from{width:100%;}
to{width:0%;}
}

/* Social */

.social{
display:flex;
justify-content:center;
gap:16px;
margin-top:32px;
}

.social a{
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
color:#fff;
text-decoration:none;
position:relative;
overflow:hidden;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 14px 35px rgba(0,0,0,.24);
transition:.35s ease;
}

.social a i{
position:relative;
z-index:2;
}

.social a::before{
content:"";
position:absolute;
inset:0;
opacity:0;
transition:.35s ease;
}

.social a:hover{
transform:translateY(-8px) rotate(-3deg) scale(1.08);
border-color:rgba(255,255,255,.38);
}

.social a.facebook::before{
background:#1877f2;
}

.social a.facebook:hover::before{
opacity:1;
}

.social a.facebook:hover{
box-shadow:0 18px 35px rgba(24,119,242,.45);
}

.social a.instagram::before{
background:
radial-gradient(circle at 30% 105%,#fdf497 0%,#fdf497 18%,#fd5949 42%,#d6249f 62%,#285AEB 100%);
}

.social a.instagram:hover::before{
opacity:1;
}

.social a.instagram:hover{
box-shadow:
0 18px 35px rgba(214,36,159,.42),
0 0 24px rgba(253,89,73,.28);
}

.social a.x-twitter::before{
background:#000;
}

.social a.x-twitter:hover::before{
opacity:1;
}

.social a.x-twitter:hover{
box-shadow:0 18px 35px rgba(255,255,255,.15);
}

footer{
margin-top:32px;
font-size:13px;
color:#bdbdc8;
}

/* Mobile */

@media(max-width:600px){

.card{
padding:40px 22px;
border-radius:28px;
}

.error-code{
font-size:76px;
}

h1{
font-size:25px;
}

.message{
font-size:15px;
}

.social a{
width:40px;
height:40px;
font-size:16px;
}

footer{
font-size:12px;
}

}

@media(prefers-reduced-motion:reduce){

*{
animation:none !important;
transition:none !important;
}

}

</style>

</head>

<body>

<div class="float-shape shape-one"></div>
<div class="float-shape shape-two"></div>
<div class="float-shape shape-three"></div>

<div class="dot" style="left:10%;animation-delay:0s"></div>
<div class="dot" style="left:25%;animation-delay:3s"></div>
<div class="dot" style="left:45%;animation-delay:1s"></div>
<div class="dot" style="left:65%;animation-delay:5s"></div>
<div class="dot" style="left:85%;animation-delay:2s"></div>

<div class="card">

<div class="error-code">
404
</div>

<h1>
Page Not Found
</h1>

<p class="message">
Looks like this page wandered into the unknown. You will be redirected to the home page shortly.
</p>

<div class="timer">
Redirecting in <span id="count">10</span> seconds
</div>

<div class="progress">
<span></span>
</div>

<div class="social">

<a href="https://facebook.com/itsIshanSarkar" target="_blank" rel="noopener" class="facebook">
<i class="fab fa-facebook-f"></i>
</a>

<a href="https://instagram.com/itsIshanSarkar" target="_blank" rel="noopener" class="instagram">
<i class="fab fa-instagram"></i>
</a>

<a href="https://x.com/itsIshanSarkar" target="_blank" rel="noopener" class="x-twitter">
<i class="fab fa-x-twitter"></i>
</a>

</div>

<footer>
© 2026 Ishan. All Rights Reserved.
</footer>

</div>

<script>

let seconds=10;
let count=document.getElementById("count");

let timer=setInterval(function(){

seconds--;

count.textContent=seconds;

if(seconds<=0){

clearInterval(timer);

window.location.href="/";

}

},1000);


// Extra floating particle effect

for(let i=0;i<24;i++){

let particle=document.createElement("div");

particle.className="dot";

particle.style.left=Math.random()*100+"%";

particle.style.animationDuration=
(8+Math.random()*14)+"s";

particle.style.animationDelay=
Math.random()*10+"s";

particle.style.width=
(2+Math.random()*4)+"px";

particle.style.height=
particle.style.width;

particle.style.opacity=
(.25+Math.random()*.5);

document.body.appendChild(particle);

}

</script>

</body>
</html>
