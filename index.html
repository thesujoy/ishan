<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:"Poppins",sans-serif;
background:#09070f;
color:#fff;
overflow-x:hidden;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:28px;
position:relative;
}

/* =============================
   New Animated Background
============================= */

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 15% 20%,rgba(255,77,109,.28),transparent 28%),
radial-gradient(circle at 85% 75%,rgba(255,209,102,.22),transparent 30%),
radial-gradient(circle at 60% 15%,rgba(145,99,255,.20),transparent 32%),
linear-gradient(135deg,#07060d,#141020 45%,#08070d);
z-index:-5;
animation:bgShift 12s ease-in-out infinite alternate;
}

@keyframes bgShift{
from{
filter:hue-rotate(0deg);
}
to{
filter:hue-rotate(18deg);
}
}

body::after{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
background-size:70px 70px;
mask-image:radial-gradient(circle,black 35%,transparent 80%);
z-index:-4;
animation:gridSlide 30s linear infinite;
}

@keyframes gridSlide{
from{
background-position:0 0;
}
to{
background-position:140px 140px;
}
}

/* Floating decorative cards */

.float-shape{
position:fixed;
width:70px;
height:90px;
border-radius:16px;
background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.03));
border:1px solid rgba(255,255,255,.12);
box-shadow:0 20px 50px rgba(0,0,0,.25);
z-index:-2;
animation:shapeFloat 8s ease-in-out infinite;
}

.float-shape::before{
content:"";
position:absolute;
left:15px;
right:15px;
top:20px;
height:2px;
background:rgba(255,255,255,.32);
box-shadow:
0 12px rgba(255,255,255,.22),
0 24px rgba(255,255,255,.16);
}

.shape-one{
top:15%;
left:8%;
transform:rotate(-14deg);
}

.shape-two{
right:8%;
bottom:14%;
width:85px;
height:60px;
transform:rotate(13deg);
animation-delay:-3s;
}

.shape-three{
right:16%;
top:12%;
width:48px;
height:48px;
border-radius:50%;
animation-delay:-5s;
}

@keyframes shapeFloat{
0%,100%{
translate:0 0;
}
50%{
translate:0 -24px;
}
}

/* Dots */

.dot{
position:fixed;
width:4px;
height:4px;
border-radius:50%;
background:rgba(255,255,255,.38);
box-shadow:0 0 16px rgba(255,255,255,.55);
animation:float 12s linear infinite;
z-index:-1;
}

@keyframes float{
from{
transform:translateY(110vh) scale(.7);
opacity:0;
}
20%{
opacity:.9;
}
80%{
opacity:.9;
}
to{
transform:translateY(-20vh) scale(1.2);
opacity:0;
}
}

/* =============================
   Main Layout
============================= */

.card{
width:920px;
max-width:100%;
min-height:460px;
display:grid;
grid-template-columns:330px 1fr;
align-items:center;
gap:20px;
padding:34px;
position:relative;
overflow:hidden;
border-radius:38px;
background:rgba(255,255,255,.075);
border:1px solid rgba(255,255,255,.16);
backdrop-filter:blur(24px);
-webkit-backdrop-filter:blur(24px);
box-shadow:
0 35px 100px rgba(0,0,0,.58),
inset 0 1px 0 rgba(255,255,255,.15);
animation:cardIn .9s ease both;
}

@keyframes cardIn{
from{
opacity:0;
transform:translateY(45px) scale(.96);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.card::before{
content:"";
position:absolute;
width:360px;
height:360px;
border-radius:50%;
background:radial-gradient(circle,rgba(255,77,109,.25),transparent 70%);
left:-120px;
top:-120px;
z-index:-1;
}

.card::after{
content:"";
position:absolute;
width:300px;
height:300px;
border-radius:50%;
background:radial-gradient(circle,rgba(255,209,102,.18),transparent 70%);
right:-100px;
bottom:-120px;
z-index:-1;
}

/* Left Profile Area */

.profile-area{
height:100%;
min-height:390px;
border-radius:30px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
background:
linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
border:1px solid rgba(255,255,255,.12);
overflow:hidden;
}

.profile-area::before{
content:"";
position:absolute;
width:260px;
height:260px;
border:1px dashed rgba(255,255,255,.26);
border-radius:50%;
animation:orbitSpin 18s linear infinite;
}

.profile-area::after{
content:"✦";
position:absolute;
top:70px;
right:58px;
font-size:24px;
color:#ffd166;
text-shadow:0 0 18px rgba(255,209,102,.75);
animation:starBlink 2.2s ease-in-out infinite;
}

@keyframes orbitSpin{
to{
transform:rotate(360deg);
}
}

@keyframes starBlink{
0%,100%{
opacity:.45;
transform:scale(.9);
}
50%{
opacity:1;
transform:scale(1.15);
}
}

.profile-frame{
width:198px;
height:198px;
border-radius:50%;
padding:6px;
position:relative;
background:
conic-gradient(from 180deg,#ffd166,#ff4d6d,#9b5cff,#ffd166);
box-shadow:
0 0 45px rgba(255,77,109,.35),
0 0 80px rgba(255,209,102,.18);
animation:profileFloat 4.5s ease-in-out infinite;
}

@keyframes profileFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-12px);
}
}

.profile{
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
display:block;
border:6px solid #11101a;
}

/* Right Content */

.content{
text-align:left;
padding:20px 18px 20px 28px;
}

h1{
font-size:58px;
line-height:1;
font-weight:700;
letter-spacing:1px;
background:linear-gradient(90deg,#fff,#ffd166,#ff7892,#fff);
background-size:250%;
-webkit-background-clip:text;
background-clip:text;
color:transparent;
animation:nameGlow 5s ease-in-out infinite;
}

@keyframes nameGlow{
0%,100%{
background-position:0% 50%;
}
50%{
background-position:100% 50%;
}
}

.tagline{
display:inline-block;
margin-top:18px;
padding:10px 18px;
border-radius:999px;
font-size:16px;
font-weight:500;
color:#ffd166;
background:rgba(255,209,102,.09);
border:1px solid rgba(255,209,102,.22);
box-shadow:0 10px 25px rgba(255,209,102,.08);
}

.bio{
max-width:560px;
margin-top:24px;
font-size:17px;
line-height:1.8;
color:#eeeeee;
}

.bio strong{
color:#fff;
text-shadow:0 0 16px rgba(255,209,102,.32);
}

.social{
display:flex;
gap:16px;
margin-top:34px;
}

.social a{
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
color:#fff;
text-decoration:none;
position:relative;
overflow:hidden;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 14px 35px rgba(0,0,0,.24);
transition:.35s ease;
}

.social a i{
position:relative;
z-index:2;
}

.social a::before{
content:"";
position:absolute;
inset:0;
opacity:0;
transition:.35s ease;
}

.social a:hover{
transform:translateY(-8px) rotate(-3deg) scale(1.08);
border-color:rgba(255,255,255,.38);
}

/* Facebook */

.social a.facebook::before{
background:#1877f2;
}

.social a.facebook:hover::before{
opacity:1;
}

.social a.facebook:hover{
box-shadow:0 18px 35px rgba(24,119,242,.45);
}

/* Instagram proper color */

.social a.instagram::before{
background:
radial-gradient(circle at 30% 105%,#fdf497 0%,#fdf497 18%,#fd5949 42%,#d6249f 62%,#285AEB 100%);
}

.social a.instagram:hover::before{
opacity:1;
}

.social a.instagram:hover{
box-shadow:
0 18px 35px rgba(214,36,159,.42),
0 0 24px rgba(253,89,73,.28);
}

/* X */

.social a.x-twitter::before{
background:#000;
}

.social a.x-twitter:hover::before{
opacity:1;
}

.social a.x-twitter:hover{
box-shadow:0 18px 35px rgba(255,255,255,.15);
}

/* Footer */

footer{
margin-top:36px;
font-size:13px;
color:#bdbdc8;
letter-spacing:.35px;
}

/* =============================
   Mobile
============================= */

@media(max-width:760px){

body{
padding:20px;
}

.card{
grid-template-columns:1fr;
padding:24px;
border-radius:30px;
gap:26px;
}

.profile-area{
min-height:270px;
border-radius:26px;
}

.profile-area::before{
width:220px;
height:220px;
}

.profile-area::after{
top:42px;
right:45px;
}

.profile-frame{
width:165px;
height:165px;
}

.content{
text-align:center;
padding:0 4px 6px;
}

h1{
font-size:42px;
}

.tagline{
font-size:14px;
margin-top:16px;
}

.bio{
font-size:15px;
line-height:1.7;
margin-top:22px;
}

.social{
justify-content:center;
gap:14px;
margin-top:30px;
}

.social a{
width:40px;
height:40px;

font-size:16px;
}

footer{
font-size:12px;
}

}

@media(max-width:390px){

.card{
padding:20px;
}

.profile-frame{
width:148px;
height:148px;
}

h1{
font-size:36px;
}

.bio{
font-size:14px;
}

}

/* Accessibility */

@media(prefers-reduced-motion:reduce){

*{
animation:none !important;
transition:none !important;
}

}

</style>

</head>

</body>

</html>
