<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:"Poppins",sans-serif;
min-height:100vh;
background:#14121f;
color:#f8f5ff;
overflow-x:hidden;
display:flex;
align-items:center;
justify-content:center;
padding:28px;
position:relative;
}

/* =============================
   Simple Animated Background
============================= */

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 18% 18%,rgba(196,181,253,.26),transparent 30%),
radial-gradient(circle at 82% 72%,rgba(251,113,133,.20),transparent 34%),
radial-gradient(circle at 50% 90%,rgba(45,212,191,.14),transparent 36%),
linear-gradient(135deg,#14121f,#1f1b33 55%,#101827);
z-index:-5;
animation:bgMove 12s ease-in-out infinite alternate;
}

@keyframes bgMove{
from{
filter:hue-rotate(0deg);
}
to{
filter:hue-rotate(10deg);
}
}

body::after{
content:"";
position:fixed;
width:360px;
height:360px;
border-radius:50%;
background:rgba(196,181,253,.13);
right:-120px;
top:-110px;
filter:blur(40px);
z-index:-4;
animation:orbMove 8s ease-in-out infinite alternate;
}

@keyframes orbMove{
from{
transform:translate(0,0);
}
to{
transform:translate(-40px,55px);
}
}

.bg-dot{
position:fixed;
width:6px;
height:6px;
border-radius:50%;
background:rgba(248,245,255,.45);
z-index:-2;
animation:dotFloat 7s ease-in-out infinite;
}

@keyframes dotFloat{
0%,100%{
transform:translateY(0);
opacity:.35;
}
50%{
transform:translateY(-22px);
opacity:.8;
}
}

/* =============================
   Card
============================= */

.card{
width:720px;
max-width:100%;
text-align:center;
padding:46px 36px;
border-radius:30px;
background:rgba(255,255,255,.075);
border:1px solid rgba(255,255,255,.14);
box-shadow:0 28px 80px rgba(0,0,0,.35);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
animation:cardShow .8s ease both;
position:relative;
overflow:hidden;
}

@keyframes cardShow{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.card::before{
content:"";
position:absolute;
top:0;
left:50%;
transform:translateX(-50%);
width:150px;
height:4px;
border-radius:999px;
background:linear-gradient(90deg,#c4b5fd,#fb7185,#2dd4bf);
}

.profile-wrap{
width:165px;
height:165px;
margin:0 auto 24px;
border-radius:50%;
padding:5px;
background:linear-gradient(135deg,#c4b5fd,#fb7185,#2dd4bf);
box-shadow:0 18px 40px rgba(0,0,0,.28);
animation:imageFloat 4.5s ease-in-out infinite;
}

@keyframes imageFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-10px);
}
}

.profile{
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
display:block;
border:5px solid #14121f;
}

h1{
font-size:52px;
line-height:1.1;
font-weight:700;
letter-spacing:.5px;
color:#fff;
display:inline-block;
animation:nameWave 3.8s ease-in-out infinite;
text-shadow:
0 0 18px rgba(196,181,253,.28),
0 0 28px rgba(251,113,133,.16);
}

@keyframes nameWave{
0%,100%{
transform:translateY(0) skewX(0deg);
}
25%{
transform:translateY(-3px) skewX(-2deg);
}
50%{
transform:translateY(0) skewX(0deg);
}
75%{
transform:translateY(3px) skewX(2deg);
}
}

.tagline{
margin-top:12px;
font-size:18px;
font-weight:500;
color:#c4b5fd;
}

.bio{
max-width:560px;
margin:24px auto 0;
font-size:16.5px;
line-height:1.8;
color:#e9e5f3;
}

.bio strong{
color:#ffffff;
}

/* Social */

.social{
display:flex;
justify-content:center;
gap:14px;
margin-top:34px;
}

.social a{
width:48px;
height:48px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
color:#fff;
text-decoration:none;
position:relative;
overflow:hidden;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.16);
transition:.32s ease;
}

.social a i{
position:relative;
z-index:2;
}

.social a::before{
content:"";
position:absolute;
inset:0;
opacity:0;
transition:.32s ease;
}

.social a:hover{
transform:translateY(-6px) scale(1.06);
border-color:rgba(255,255,255,.32);
}

.social a.facebook::before{
background:#1877f2;
}

.social a.facebook:hover::before{
opacity:1;
}

.social a.instagram::before{
background:
radial-gradient(circle at 30% 105%,#fdf497 0%,#fdf497 18%,#fd5949 42%,#d6249f 62%,#285AEB 100%);
}

.social a.instagram:hover::before{
opacity:1;
}

.social a.x-twitter::before{
background:#000;
}

.social a.x-twitter:hover::before{
opacity:1;
}

.social a.envelope::before{
background:#8b2dfc;
}

.social a.envelope:hover::before{
opacity:1;
}

.social a.youtube::before{
background:red;
}

.social a.youtube:hover::before{
opacity:1;
}

footer{
margin-top:34px;
font-size:13px;
color:#b9b4c8;
}

/* Mobile */

@media(max-width:600px){

body{
padding:22px;
}

.card{
padding:38px 22px;
border-radius:26px;
}

.profile-wrap{
width:140px;
height:140px;
}

h1{
font-size:40px;
}

.tagline{
font-size:15px;
}

.bio{
font-size:15px;
line-height:1.75;
}

.social a{
width:44px;
height:44px;
font-size:16px;
}

footer{
font-size:12px;
}

}

@media(prefers-reduced-motion:reduce){

*{
animation:none !important;
transition:none !important;
}

}
